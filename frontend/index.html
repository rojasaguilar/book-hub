<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <nav class="nav-bar">
        <div class="box">
          <a class="logo-titulo" href="/home"
            ><img
              style="width: 2.5rem; height: 2.5rem"
              src="/assets/book-hub.png"
              alt="img"
            />

            <p>Book-hub</p></a
          >
        </div>

        <div class="box-links" id="">
          <!-- <div class="libros-home"> -->
          <a id="home-link" href="/home"
            >Libros <img src="/assets/icons/library-big.svg" alt=""
          /></a>
          <!-- <img src="/assets/icons/star.svg" alt=""> -->
          <!-- </div> -->
          <!-- <div class="favorito"> -->

          <a id="fav-link" href="/favoritos"
            >Favoritos <img src="/assets/icons/star.svg" alt=""
          /></a>
          <!-- </div> -->
        </div>

        <div class="box-profile">
          <a
            class="subir-btn"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 0.5rem;
            "
            href="/agregar"
            style="color: black"
          >
            <img src="/assets/icons/upload.svg" alt="" />
          </a>

          <div class="profile-picture">
            <a href="/profile"
              ><img id="profile-picture" src="/assets/cat.jpg" alt="img" />
              <div class="logout exited" id="logout">
                <div class="item entrar-perfil">
                  <img
                    src="/assets/icons/user-round.svg"
                    style="width: 16px; height: 16px"
                    alt=""
                  />
                  <p>Perfil</p>
                </div>
                <div class="item btn_logout">
                  <img
                    src="/assets/icons/log-out.svg"
                    style="width: 16px; height: 16px"
                    alt=""
                  />
                  <p>Logout</p>
                </div>
              </div>
            </a>
          </div>
        </div>
      </nav>

      <div id="main-page">
        <div class="mensaje-buscar">
          <div class="titulo-mensaje">
            <h1>Nuevos &</h1>
            <h1>populares</h1>
          </div>
          <p>Explora nuevos títulos</p>
          <div class="buscar-libro-cont">
            <input
              id="buscar-libro"
              name="buscar-libro"
              class="buscar-libro"
              style="border: none; outline: none"
              type="text"
              placeholder="Titulo"
            />
            <img
              style="width: 16px; height: 16px"
              src="/assets/icons/search.svg"
              alt=""
            />
          </div>
        </div>

        <div id="parent" class="parent">%libros%</div>
      </div>
    </div>
  </body>
  <script>
    const link = document.getElementById("fav-link");
    const linkHome = document.getElementById("home-link");
    let url = window.location.href;
    if (url.includes("/favoritos")) {
      link.style.backgroundColor = "#21BA64";
      // linkHome.style.transition = "background-color 2s ease-in-out";
    }
    if (url.includes("/home")) {
      linkHome.style.backgroundColor = "#21BA64";

      // link.style.transition = "background-color 2s ease-in-out";
    }

    let timeout;
    const barraBusqueda = document.getElementById("buscar-libro");
    let parent = document.getElementById("parent").innerHTML;

    window.addEventListener("load", () => {
      parent = document.getElementById("parent").innerHTML;
      url = window.location.href;
    });

    barraBusqueda.addEventListener("input", async (event) => {
      if (!barraBusqueda.value) {
        document.getElementById("parent").innerHTML = parent;
      }

      clearTimeout(timeout);
      timeout = setTimeout(async () => {
        if (!barraBusqueda.value) {
          document.getElementById("parent").innerHTML = parent;
          return;
        }
        if (url.includes("/favorito")) {
          const html = await buscarLibroPorTituloFavoritos(barraBusqueda.value);
          document.getElementById("parent").innerHTML = html;
          return;
        }
        const html = await buscarLibroPorTitulo(barraBusqueda.value);
        document.getElementById("parent").innerHTML = html;
        return;
      }, 500);
    });

    const buscarLibroPorTitulo = async (titulo) => {
      const response = await fetch(`/filtrar`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: titulo,
      });
      if (!response.ok) {
        alert("No se pudo encontrar libros");
        return;
      }
      return response.text();
    };

    const buscarLibroPorTituloFavoritos = async (titulo) => {
      const response = await fetch(`/filtrarFav`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: titulo,
      });
      if (!response.ok) {
        alert("No se pudo encontrar libros");
        return;
      }
      return response.text();
    };

    // const buscarLibroPorTituloFavoritos = async (titulo) => {
    //   const response = await fetch(`/filtrar/favoritos`, {
    //     method: "POST",
    //     headers: {
    //       "Content-Type": "application/json",
    //     },
    //     body: titulo,
    //   });
    //   if (!response.ok) {
    //     alert("No se pudo encontrar libros");
    //     return;
    //   }
    //   return response.text();
    // };

    const entrar_profile = document.querySelector(".entrar-perfil");
    entrar_profile.addEventListener("click", async () => {
      const response = await fetch("/profile");
    });

    const div_logout = document.getElementById("logout");
    const btn_logout = document.querySelector(".btn_logout");
    btn_logout.addEventListener("click", async () => {
      const response = await requestLogout();
      if (response) {
        alert("cerrada la sesion correctamente");
      }
    });

    const profile_picture = document.querySelector(".profile-picture");
    profile_picture.addEventListener("mouseenter", () => {
      div_logout.classList.remove("exited");
      div_logout.classList.add("entered");
    });
    profile_picture.addEventListener("mouseleave", () => {
      div_logout.classList.add("exited");
    });

    const requestLogout = async () => {
      const response = await fetch("/logout");
      if (!response.ok) {
        alert("error");
        return null;
      }
      return response.text();
    };
  </script>
</html>
