<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/template-subir.css" />
  </head>

      <nav class="nav-bar">
        <div class="box">
          <a class="logo-titulo" href="/home"
            ><img style="width: 2.5rem; height: 2.5rem" src="/assets/book-hub.png" alt="img" />

            <p>Book-hub</p></a
          >
        </div>

        <div class="box-links" id="">
          <!-- <div class="libros-home"> -->
          <a id="home-link" href="/home">Libros <img src="/assets/icons/library-big.svg" alt="" /></a>
          <!-- <img src="/assets/icons/star.svg" alt=""> -->
          <!-- </div> -->
          <!-- <div class="favorito"> -->

          <a id="fav-link" href="/favoritos">Favoritos <img src="/assets/icons/star.svg" alt="" /></a>
          <!-- </div> -->
        </div>

        <div class="box-profile">
          <a
            class="subir-btn"
            style="display: flex; align-items: center; justify-content: center; gap: 0.5rem"
            href="/agregar"
            style="color: black"
          >
            <img src="/assets/icons/upload.svg" alt="" />
          </a>

          <div class="profile-picture">
            <a href="/profile"
              ><img id="profile-picture" src="/assets/cat.jpg" alt="img" />
              <div class="logout exited" id="logout">
                <div class="item entrar-perfil">
                  <img src="/assets/icons/user-round.svg" style="width: 16px; height: 16px" alt="" />
                  <p>Perfil</p>
                </div>
                <div class="item btn_logout">
                  <img src="/assets/icons/log-out.svg" style="width: 16px; height: 16px" alt="" />
                  <p>Logout</p>
                </div>
              </div>
            </a>
          </div>
        </div>
      </nav>
    <div class="form-container">
      <form id="form-libro" action="/agregar" method="POST" enctype="multipart/form-data">
        <div id="campo-imagen" class="campo-imagen">
          <p>Agregar portada</p>
          <div class="portada">
            <label for="portada" class="label-file">
              <img class="imagen-portada" src="" alt="" />
              <p class="plus" style="margin: 0; padding: 0 1rem 0 1rem; background-color: #147c58">+</p>
            </label>
            <input
              class="portada-input"
              id="portada"
              name="portada"
              type="file"
              accept="imagen/jpeg image/png image/jpg image/webp"
            />
          </div>
        </div>

        <div class="informacion-libro" style="display: flex; flex-direction: column; gap: 2rem">
          <p style="border-bottom: 2px solid #147c58; padding: 0; margin: 0; width: fit-content; font-size: 16px">
            Detalles del libro
          </p>

          <div class="titulo-autor-sinopsis">
            <div class="titulo-autor">
              <div class="campo">
                <p>Título</p>
                <input name="titulo" type="text" />
              </div>

              <div class="campo">
                <p>Autor</p>
                <input name="autor" type="text" />
              </div>
            </div>
            <div class="campo">
              <p>Sinopsis</p>
              <textarea rows="10" cols="48" name="sinopsis" id=""></textarea>
            </div>
          </div>

          <div class="genero-paginas-capitulos">
            <div class="campo">
              <p>Genero</p>
              <select name="categoria" id="">
                <option value="arte">arte</option>
                <option value="accion">accion</option>
                <option value="aventura">aventura</option>
                <option value="biografía">biografía</option>
                <option value="ciencia ficcion">ciencia ficcion</option>
                <option value="distopía">distopía</option>
                <option value="educativo">educativo</option>
                <option value="fantasía">fantasía</option>
                <option value="infantil">infantil</option>
                <option value="poesía">poesía</option>
                <option value="romance">romance</option>
                <option value="suspenso">suspenso</option>
                <option value="terror">terror</option>
                <option value="novela">novela</option>
              </select>
            </div>
            <div class="campo">
              <label for="noPaginas">Número de páginas</label>
              <input type="text" name="noPaginas" id="" />
            </div>
            <div class="campo">
              <label for="capitulos">Número de capítulos</label>
              <input type="text" name="capitulos" id="" />
            </div>
          </div>

          <div class="fecha-input-etiquetas">
            <div class="fecha-input">
              <div class="campo">
                <p>Fecha de publicación</p>
                <input name="fechaPublicacion" type="date" />
              </div>

              <div class="campo">
                <p>Inserta tu libro aquí</p>
                <input class="input-libro" name="libro" type="file" />
              </div>
            </div>

            <div class="campo">
              <p>Etiquetas</p>
              <!-- <input class="etiquetas" name="etiquetas" type="text" /> -->
              <textarea rows="7" cols="48" class="etiquetas" name="etiquetas" id=""></textarea>
            </div>
          </div>
          <button type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </body>

  <script>
    const portada = document.querySelector(".portada-input");
    portada.addEventListener("change", (event) => {
      let img = portada.files[0];
      let url = window.URL.createObjectURL(img);
      const preview = document.querySelector(".imagen-portada");
      preview.src = url;
      preview.setAttribute("style", "display: block");
      const add = document.querySelector(".plus");
      add.setAttribute("style", "display: none;");
      // document.getElementById("imagen-portada").style.display = block;

      const entrar_profile = document.querySelector(".entrar-perfil");
      entrar_profile.addEventListener("click", async () => {
        const response = await fetch("/profile");
      });

     
    });

     const div_logout = document.getElementById("logout");
      const btn_logout = document.querySelector(".btn_logout");
      btn_logout.addEventListener("click", async () => {
        const response = await requestLogout();
        if (response) {
          alert("cerrada la sesion correctamente");
        }
      });
    const profile_picture = document.querySelector(".profile-picture");
      profile_picture.addEventListener("mouseenter", () => {
        div_logout.classList.remove("exited");
        div_logout.classList.add("entered");
      });
      profile_picture.addEventListener("mouseleave", () => {
        div_logout.classList.add("exited");
      });

      const requestLogout = async () => {
        const response = await fetch("/logout");
        if (!response.ok) {
          alert("error");
          return null;
        }
        return response.text();
      };
  </script>
</html>
