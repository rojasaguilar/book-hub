<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/template-profile.css" />
  </head>

  <body>
    <nav class="nav-bar">
      <div class="box">
        <a class="logo-titulo" href="/home"
          ><img style="width: 2.5rem; height: 2.5rem" src="/assets/book-hub.png" alt="img" />

          <p>Book-hub</p></a
        >
      </div>

      <div class="box-links" id="">
        <a id="home-link" href="/home">Libros <img src="/assets/icons/library-big.svg" alt="" /></a>

        <a id="fav-link" href="/favoritos">Favoritos <img src="/assets/icons/star.svg" alt="" /></a>
      </div>

      <div class="box-profile">
        <a
          class="subir-btn"
          style="display: flex; align-items: center; justify-content: center; gap: 0.5rem"
          href="/agregar"
          style="color: black"
        >
          <img src="/assets/icons/upload.svg" alt="" />
        </a>

        <div class="profile-picture">
          <a href="/profile"
            ><img id="profile-picture" src="/assets/cat.jpg" alt="img" />
            <div class="logout exited" id="logout">
              <div class="item entrar-perfil">
                <img src="/assets/icons/user-round.svg" style="width: 16px; height: 16px" alt="" />
                <p>Perfil</p>
              </div>
              <div class="item btn_logout">
                <img src="/assets/icons/log-out.svg" style="width: 16px; height: 16px" alt="" />
                <p>Logout</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </nav>
    <div style="width: 100%; background-color: cyan; height: fit-content; display: flex; justify-content: center">
      <div class="profile-info">
        <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: center">
          <img src="../assets/cat.jpg" alt="" />
          <p style="font-weight: 600; font-size: x-large">%correo%</p>
          <p style="height: fit-content">@%nombreUsuario%</p>
        </div>

        <div class="profile-stats">
          <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: center; width: fit-content">
            <p>%librosSubidos%</p>
            <p>Libros subidos</p>
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: center">
            <p>%favoritos%</p>
            <p>Favoritos</p>
          </div>
        </div>
      </div>
    </div>

    <div class="contenedor-sobre-mi">
      <div class="sobre-mi">
        <div style="display: flex; flex-direction: row; justify-content: space-between; width: 100%">
          <p style="font-weight: 600; font-size: large">Sobre mi</p>
          <div class="editar" id="editar">
            <img src="/assets/icons/settings.svg" alt="" />
            <p>Editar perfil</p>
          </div>
        </div>

        <div style="width: fit-content; height: fit-content">
          <textarea disabled name="" id="" rows="12" cols="70">%sobremi%</textarea>
        </div>

        <div class="fecha-confirmar">
          <p class="se-unio"><strong>Se unió: </strong>%fecha%</p>
          <button class="confirmar">Confirmar</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    let state = 0;
    const btn = document.querySelector(".confirmar");
    const editar = document.getElementById("editar");
    const textArea = document.querySelector("textarea");
    editar.addEventListener("click", () => {
      if (state === 0) {
        const textArea = document.querySelector("textarea");
        const btn = document.querySelector(".confirmar");
        textArea.disabled = false;
        textArea.focus();
        btn.style.display = "inline";
        state = 1;
      } else if (state === 1) {
        textArea.disabled = true;
        btn.style.display = "none";
        state = 0;
      }
    });

    const entrar_profile = document.querySelector('.entrar-perfil');
    entrar_profile.addEventListener('click', async() => {
      const response = await fetch('/profile');
    })
    


    btn.addEventListener("click", async () => {
      const texto = textArea.value;
      const response = await sendUpdate(texto);
      if (response) {
        textArea.disabled = true;
        btn.style.display = "none";
        state = 0;
      }
    });

    const sendUpdate = async (text) => {
      const response = await fetch("/editar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ sobreMi: text }),
      });
      if (!response.ok) {
        alert("errro");
        return;
      }
      alert("Datos actualizados correctamente");
      return true;
    };

    const div_logout = document.getElementById("logout");
    const btn_logout = document.querySelector('.btn_logout')
    btn_logout.addEventListener("click", async () => {
      const response = await requestLogout();
      if (response) {
        alert("cerrada la sesion correctamente");
      }
    });

    const profile_picture = document.querySelector(".profile-picture");
    profile_picture.addEventListener("mouseenter", () => {
      div_logout.classList.remove("exited");
      div_logout.classList.add("entered");
    });
    profile_picture.addEventListener("mouseleave", () => {
      div_logout.classList.add("exited");
    });

    const requestLogout = async () => {
      const response = await fetch("/logout");
      if (!response.ok) {
        alert("error");
        return null;
      }
      return response.text();
    };
  </script>
</html>
