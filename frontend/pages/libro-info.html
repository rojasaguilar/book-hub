<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book-Hub | Lectura a tu alcance</title>
    <link rel="icon" href="assets/book-hub.png" type="image/png"  />
    <link rel="stylesheet" href="/styles/libro-info.css" />
  </head>
  <body>
    <div id="root">
      <nav class="nav-bar">
        <div class="box">
          <a class="logo-titulo" href="/home"
            ><img
              style="width: 2.5rem; height: 2.5rem"
              src="/assets/book-hub.png"
              alt="img"
            />

            <p>Book-hub</p></a
          >
        </div>

        <div class="box-links" id="">
          <!-- <div class="libros-home"> -->
          <a id="home-link" href="/home"
            >Libros <img src="/assets/icons/library-big.svg" alt=""
          /></a>
          <!-- <img src="/assets/icons/star.svg" alt=""> -->
          <!-- </div> -->
          <!-- <div class="favorito"> -->

          <a id="fav-link" href="/favoritos"
            >Favoritos <img src="/assets/icons/star.svg" alt=""
          /></a>
          <!-- </div> -->
        </div>

        <div class="box-profile">
          <a
            class="subir-btn"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 0.5rem;
            "
            href="/agregar"
            style="color: black"
          >
            <img src="/assets/icons/upload.svg" alt="" />
          </a>

          <div class="profile-picture">
            <a href="/profile"
              ><img id="profile-picture" src="/assets/cat.jpg" alt="img"
            /></a>
          </div>
        </div>
      </nav>

      <div id="main-page">
        <div class="primera-parte">
          <div class="portada">
            <img src="/public/portadas/%portada%" alt="" />
          </div>
          <div class="cont-info">
            <div class="cont-titulo">
              <strong>%titulo%</strong>
              <img class="fav" id="fav" src="%icono%" alt="" />
            </div>

            <div class="info-libro">
              <div class="element">
                <div class="subtitulo">
                  <img src="/assets/icons/book-open.svg" alt="" />
                  <p>Páginas</p>
                </div>
                <strong>%noPaginas%</strong>
              </div>
              <div class="element">
                <div class="subtitulo">
                  <img src="/assets/icons/book-open.svg" alt="" />
                  <p>Capítulos</p>
                </div>
                <strong>%capitulos%</strong>
              </div>
              <div class="element">
                <div class="subtitulo">
                  <img src="/assets/icons/book-open.svg" alt="" />
                  <p>Autor</p>
                </div>
                <strong>%autor%</strong>
              </div>
            </div>

            <div class="acciones">
              <div id="leer" class="leer">
                <img class="icon" src="/assets/icons/book-open.svg" alt="" />
                <p>Comenzar a Leer</p>
              </div>
              <div id="download" class="download">
                <img class="icon" src="/assets/icons/download.svg" alt="" />
              </div>
            </div>
          </div>
        </div>
        <div class="segunda-parte">
          <div class="subio-sinopsis">
            <div class="perfil">
              <img src="/assets/cat.jpg" alt="" />
              <p>@%nombre%</p>
            </div>
            <p class="texto">%sinopsis%</p>
          </div>
          <div class="etiquetas-reportar">
            <div class="etiquetas">%etiquetas%</div>
            <div class="reportar">
              <img src="/assets/icons/flag.svg" alt="" class="icono" />
              <p>Reportar este libro</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    let open = false;
    const link = document.getElementById("fav-link");
    const linkHome = document.getElementById("home-link");
    const url = window.location.href;
    if (url.includes("/favoritos")) {
      link.style.backgroundColor = "#21BA64";
    } else if (url.includes("/libro")) {
      linkHome.style.backgroundColor = "#21BA64";
    }

    (async () => {
      const favIcon = document.getElementById("fav");
      const params = new URLSearchParams(window.location.search);
      const titulo = params.get("titulo");

      try {
        const response = await fetch(`/isFav?titulo=${encodeURIComponent(titulo)}`);
        if (!response.ok) throw new Error("No se pudo obtener");

        const data = await response.json();
        favIcon.src = data.favorito
          ? "/assets/icons/blackStar.svg"
          : "/assets/icons/star.svg";
      } catch (err) {
        console.error(err);
      }
    })();

    const btn_download = document.getElementById("download");
    btn_download.addEventListener("click", () => {
      const params = new URLSearchParams(window.location.search);
      const title = params.get("titulo");
      fetchPDF(title)
        .then(() => {
          console.log("encontrado");
          return;
        })
        .catch((err) => {
          console.log(err);
          alert("No se pudo descargar");
          return;
        });
    });

    const btn_leer = document.getElementById("leer");
    btn_leer.addEventListener("click", () => {
      const params = new URLSearchParams(window.location.search);
      const titulo = params.get("titulo");
      fetchLibro(titulo)
        .then(() => {
          console.log("pdf cargado correctamente");
        })
        .catch((err) => console.log(err));
    });

    const fetchPDF = async (titulo) => {
      const response = await fetch(`/descargar?titulo=${encodeURIComponent(titulo)}`);

      if (!response.ok) throw new Error(700, "No se encontró el archivo");
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${titulo}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    const favIcon = document.getElementById("fav");
    favIcon.addEventListener("click", async () => {
      const params = new URLSearchParams(window.location.search);
      const titulo = params.get("titulo");

      const response = await addFav(titulo.trim());

      if (response.favorito === true) {
        favIcon.src = "/assets/icons/blackStar.svg";
        return;
      } else {
        favIcon.src = "/assets/icons/star.svg";
      }
    });

    const fetchLibro = async (titulo) => {
      const response = await fetch(`/leer?titulo=${encodeURIComponent(titulo)}`);
      if (!response.ok) {
        throw new Error("Error al cargar pdf");
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);

      window.open(url, "_blank");
    };

    const addFav = async (titulo) => {
      const response = await fetch(
        `/toggleFavorito?titulo=${encodeURIComponent(titulo)}`
      );
      if (!response.ok) {
        throw new Error("Error al marcar favorito");
      }
      return response.json();
    };

    // window.addEventListener("DOMContentLoaded", async () => {
    //   const params = new URLSearchParams(window.location.search);
    //   const titulo = params.get("titulo");

    //  try {
    //    const response = await fetchIsFav(titulo.trim());

    //   if (response.favorito === true) {
    //     favIcon.src = "/assets/icons/blackStar.svg";
    //     return;
    //   } else {
    //     favIcon.src = "/assets/icons/star.svg";
    //   }
    //  } catch (error) {
    //   console.log(error)
    //  }
    // });

    const fetchIsFav = async (titulo) => {
      const response = await fetch(`/isFav?titulo=${encodeURIComponent(titulo)}`);
      if (!response.ok) {
        throw new Error("No se pudo obtener");
      }
      return response.json();
    };
  </script>
</html>
